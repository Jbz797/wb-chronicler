<div class="reader-page">
  <ng-scrollbar class="reader-scroll">
    <article
      class="ant-typography"
      [class.chapter]="isChapter()"
      [style.--fleuron]="favoriteHue()"
      (pointerout)="onProseOut($event)"
      (pointerover)="onProseOver($event)"
    >
      @if (src(); as s) {
        <markdown [disableSanitizer]="true" [src]="s" (ready)="onReady()" />
      } @else if (merged.hasValue()) {
        <markdown [data]="merged.value()" [disableSanitizer]="true" (ready)="onReady()" />
      } @else if (awaitsChronicler()) {
        <div class="bootstrap">
          <h1>{{ 'ui_chronicler_pending' | translate }}</h1>
          <p>{{ 'ui_bootstrap_how' | translate: { folder: 'src/assets/world/', terminal: 'claude' } }}</p>
          <p class="order">{{ 'ui_bootstrap_order' | translate }}</p>
        </div>
      }
    </article>
  </ng-scrollbar>
  @if (proseHint(); as h) {
    <span nz-tooltip [nzTooltipOrigin]="h.origin" [nzTooltipTitle]="h.text" [nzTooltipTrigger]="null" [nzTooltipVisible]="true"></span>
  }
</div>
