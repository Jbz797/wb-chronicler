@if (kingdom(); as k) {
  <nz-tag class="entity-tag" [class.dead]="k.dead" [style.--tag-color]="k.color" [title]="name()">
    <canvas #banner class="banner"></canvas>
    <span class="entity-name">{{ name() }}</span>
    @if (medal() && k.rank; as r) {
      <img class="medal" [src]="`assets/img/podium/${r}.png`" />
    }
    @if (k.cities; as c) {
      <span class="tag-badge">
        <span>{{ c }}</span>
      </span>
    }
    @if (k.species; as s) {
      <img [src]="`assets/img/species/${s}.png`" />
    }
  </nz-tag>
}
