@if (kingdom(); as k) {
  <nz-tag class="entity-tag kingdom-tag" [class.dead]="k.dead" [style.--tag-color]="color()" [title]="name()">
    <canvas #banner class="banner" height="0" width="0"></canvas>
    <span class="entity-name">{{ name() }}</span>
    @if (medal() && k.rank; as r) {
      <img [src]="`assets/img/podium/${r}.png`" />
    }
    @if (k.cities; as c) {
      <span class="tag-badge">{{ c }}</span>
    }
    @if (k.species; as s) {
      <img [src]="`assets/img/species/${s}.png`" />
    }
  </nz-tag>
}
