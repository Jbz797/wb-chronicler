@if (city(); as c) {
  <nz-tag class="entity-tag" [class.dead]="c.dead" [style.--tag-color]="c.color" [title]="name()">
    <canvas #crown class="crown"></canvas>
    <span class="entity-name">{{ name() }}</span>
    @if (medal() && c.rank; as r) {
      <img class="medal" [src]="`assets/img/podium/${r}.png`" />
    }
    @if (c.size; as s) {
      <span class="tag-badge">
        <span>{{ s }}</span>
      </span>
    }
    @if (c.species; as sp) {
      <img [src]="`assets/img/species/${sp}.png`" />
    }
  </nz-tag>
}
