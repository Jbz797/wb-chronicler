@if (plot(); as p) {
  <nz-descriptions nzBordered nzSize="small" [nzColumn]="1" [nzTitle]="plotTitle">
    <nz-descriptions-item nzTitle="Type">{{ typeLabel(p.type.id) }}</nz-descriptions-item>
    <nz-descriptions-item nzTitle="Cible">
      @if (p.target_city; as city) {
        <app-city-tag [id]="city.id" [name]="city.name" />
      } @else if (p.target_kingdom; as kingdom) {
        <app-kingdom-tag [id]="kingdom.id" [name]="kingdom.name" />
      } @else {
        {{ p.target_alliance?.name ?? '—' }}
      }
    </nz-descriptions-item>
    <nz-descriptions-item nzTitle="Progression">
      <nz-progress nzSize="small" nzStatus="active" [nzPercent]="p.progress" [nzShowInfo]="false" [nzStrokeColor]="progressColor()" />
    </nz-descriptions-item>
  </nz-descriptions>

  <ng-template #plotTitle>
    Complot en cours
    <app-new-badge [dot]="false" [show]="isNew()" />
  </ng-template>
}
