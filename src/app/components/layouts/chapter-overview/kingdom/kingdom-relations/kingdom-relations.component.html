@if (relations().length) {
  <h3 class="relations-title">{{ 'ui_relations' | translate }}</h3>
  <nz-table nzBordered nzSize="small" [nzData]="sorted()" [nzShowPagination]="false">
    <thead>
      <tr>
        <th>{{ 'ui_kingdom' | translate }}</th>
        <th>{{ 'ui_status' | translate }}</th>
        <th>{{ 'ui_opinion' | translate }}</th>
      </tr>
    </thead>
    <tbody>
      @for (r of sorted(); track r.kingdom.id) {
        <tr>
          <td><app-kingdom-tag [id]="r.kingdom.id" [name]="r.kingdom.name" /></td>
          <td>
            <nz-tag [nzColor]="statusColor[r.status]">{{ `relation_${r.status}` | translate }}</nz-tag>
          </td>
          <td [class]="opinionClass(r.opinion.total)">{{ r.opinion.total > 0 ? '+' : '' }}{{ r.opinion.total }}</td>
        </tr>
      }
    </tbody>
  </nz-table>
}
