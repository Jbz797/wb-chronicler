@if (kingdom(); as k) {
  <nz-tag class="entity-tag kingdom-tag" [class.dead]="k.dead" [style.--tag-color]="color()">
    <canvas #banner class="banner" height="0" width="0"></canvas>
    <span #truncated="appTruncated" appTruncated class="entity-name" nz-tooltip [nzTooltipTitle]="truncated.isTruncated() ? name() : ''">{{ name() }}</span>
    @if (medal() && k.rank; as r) {
      <img [src]="`assets/img/podium/${r}.png`" />
    }
    @if (k.size; as size) {
      <span class="tag-badge">{{ size }}</span>
    }
    @if (k.species; as s) {
      <img [src]="`assets/img/species/${s}.png`" />
    }
  </nz-tag>
}
