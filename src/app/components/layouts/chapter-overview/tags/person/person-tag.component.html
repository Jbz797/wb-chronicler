@if (person(); as p) {
  <nz-tag
    class="entity-tag"
    nz-tooltip
    [class.dead]="p.dead"
    [class.hinted]="hint()"
    [nzTooltipTitle]="hint() ? aboutTemplate : truncated.isTruncated() ? label() : ''"
    [style.--tag-color]="color()"
    [style.--tag-ring]="ring()"
  >
    <canvas #portrait class="portrait" height="0" width="0"></canvas>
    <span #truncated="appTruncated" appTruncated class="entity-name">{{ label() }}</span>
    @if (p.rank; as r) {
      <img [src]="`assets/img/podium/${r}.png`" />
    }
    @if (p.level; as l) {
      <span class="tag-badge">{{ l }}</span>
    }
    @for (b of bonds(); track b.icon) {
      <img [src]="`assets/img/stats/${b.icon}.png`" />
    }
    @if (p.sex; as s) {
      <img [src]="`assets/img/sex/${s}.png`" />
    }
    @if (p.job) {
      <img [src]="`assets/img/professions/${p.job}.png`" />
    }
  </nz-tag>
  <ng-template #aboutTemplate>
    @if (truncated.isTruncated()) {
      <div>{{ label() }}</div>
    }
    <div>{{ about() }}</div>
  </ng-template>
}
