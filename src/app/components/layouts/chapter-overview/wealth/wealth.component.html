<nz-descriptions nzBordered nzSize="small" [nzColumn]="2" [nzTitle]="'ui_wealth' | translate">
  @for (s of shares(); track s.label) {
    <ng-template #shareTitle>
      <img [src]="`assets/img/${s.icon}.png`" />
      <span>{{ s.label | translate }}</span>
    </ng-template>
    <nz-descriptions-item [nzTitle]="shareTitle">
      <span nz-tooltip [nzTooltipTitle]="s.value === undefined ? '' : (s.value | exact)">{{ s.value === undefined ? '—' : (s.value | compact) }}</span>
    </nz-descriptions-item>
  }
  <nz-descriptions-item [nzSpan]="2" [nzTitle]="totalTitle">
    <app-ranked-stat stat="wealth" [source]="source()" />
  </nz-descriptions-item>
  <nz-descriptions-item [nzSpan]="2" [nzTitle]="perCapitaTitle">
    <app-ranked-stat numberFormat="1.1-1" stat="wealth_per_capita" suffix="/hab" [source]="source()" />
  </nz-descriptions-item>
</nz-descriptions>

<ng-template #perCapitaTitle>
  <img src="assets/img/stats/loot.png" />
  <span>{{ 'ui_per_head' | translate }}</span>
</ng-template>
<ng-template #totalTitle>
  <img src="assets/img/stats/money.png" />
  <span>{{ 'ui_total' | translate }}</span>
</ng-template>
