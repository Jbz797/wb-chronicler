@if (personRows().length || familyRows().length) {
  <nz-descriptions nzBordered nzSize="small" [nzColumn]="1" [nzTitle]="'ui_standing' | translate">
    @for (row of personRows(); track row.key) {
      <ng-template #personTitle>
        <img [src]="row.icon" />
        <span>{{ row.label | translate }}</span>
      </ng-template>
      <nz-descriptions-item [nzTitle]="personTitle">
        <app-person-tag [id]="row.ref.id" [name]="row.ref.name" />
      </nz-descriptions-item>
    }
    @for (row of familyRows(); track row.key) {
      <ng-template #familyTitle>
        <img [src]="row.icon" />
        <span>{{ row.label | translate }}</span>
      </ng-template>
      <nz-descriptions-item [nzTitle]="familyTitle">
        <app-family-tag [id]="row.ref.id" [name]="row.ref.name" />
      </nz-descriptions-item>
    }
  </nz-descriptions>
}
