<div class="inventory">
  @for (item of entries(); track item.key) {
    <span nz-tooltip [nzTooltipTitle]="`resource_${item.key}` | translate">
      <img [src]="`assets/img/resources/${item.key}.png`" />
      x{{ item.amount }}
    </span>
  } @empty {
    <em>{{ 'ui_empty' | translate }}</em>
  }
</div>
