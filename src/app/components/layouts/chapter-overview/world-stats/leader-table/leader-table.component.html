@if (rows().length) {
  <nz-descriptions nzBordered nzSize="small" [nzColumn]="1" [nzTitle]="title()">
    @for (row of rows(); track row.data.key) {
      <ng-template #titleRef>
        <img [src]="`assets/img/world/${row.icon}.png`" />
        <span>{{ row.label }}</span>
      </ng-template>
      <nz-descriptions-item [nzTitle]="titleRef">
        <app-leader-row [row]="row.data" />
      </nz-descriptions-item>
    }
  </nz-descriptions>
}
