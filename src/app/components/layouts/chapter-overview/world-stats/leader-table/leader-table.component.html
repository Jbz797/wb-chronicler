@if (rows().length) {
  <nz-descriptions nzBordered nzSize="small" [nzColumn]="1" [nzTitle]="heading()">
    <!-- Rows tracked by place: one dropped or reordered between chapters shifts the rest, and a moved `nz-descriptions-item` loses what it projects. -->
    @for (row of rows(); track $index) {
      <ng-template #titleRef>
        <img [src]="row.icon" />
        <span>{{ row.label | translate }}</span>
        <app-new-badge [show]="row.data.isNew ?? false" />
      </ng-template>
      <nz-descriptions-item [nzTitle]="titleRef">
        <app-leader-row [row]="row.data" />
      </nz-descriptions-item>
    }
  </nz-descriptions>
}
