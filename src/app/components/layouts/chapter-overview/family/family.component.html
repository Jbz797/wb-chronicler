@if (family(); as f) {
  <nz-descriptions nzBordered nzSize="small" [nzColumn]="1">
    @for (founder of founders(); track founder.id) {
      <ng-template #founderTitle>
        <img src="assets/img/world/founder.png" /><span>{{ founder.label }}</span>
      </ng-template>
      <nz-descriptions-item [nzTitle]="founderTitle">
        <app-person-tag [id]="founder.id" [name]="founder.name" />
      </nz-descriptions-item>
    }

    @if (f.metadata.alpha; as alpha) {
      <nz-descriptions-item [nzTitle]="alphaTitle">
        <app-person-tag [id]="alpha.id" [name]="alpha.name" />
      </nz-descriptions-item>
    }

    <nz-descriptions-item [nzTitle]="ageTitle">
      <app-ranked-stat source="family" stat="age" suffix=" ans" />
    </nz-descriptions-item>
    <nz-descriptions-item [nzTitle]="renownTitle">
      <app-ranked-stat source="family" stat="renown" />
    </nz-descriptions-item>
    <nz-descriptions-item [nzTitle]="membersTitle">
      <app-ranked-stat source="family" stat="members" />
    </nz-descriptions-item>

    @for (s of lifetimeStats(); track s.stat) {
      <ng-template #lifetimeTitle>
        <img [src]="s.icon" /><span>{{ s.label }}</span>
      </ng-template>
      <nz-descriptions-item [nzTitle]="lifetimeTitle">
        <app-ranked-stat source="family" [inverted]="s.inverted" [stat]="s.stat" />
      </nz-descriptions-item>
    }

    <nz-descriptions-item [nzTitle]="housesTitle">
      <app-ranked-stat source="family" stat="houses" />
    </nz-descriptions-item>
    <nz-descriptions-item [nzTitle]="housedTitle">
      <app-ranked-stat source="family" stat="housed_pct" suffix=" %" />
    </nz-descriptions-item>
    <nz-descriptions-item [nzTitle]="moneyTitle">
      <app-ranked-stat source="family" stat="money" />
    </nz-descriptions-item>
  </nz-descriptions>

  <app-breakdown source="family" />

  <ng-template #ageTitle><img src="assets/img/stats/age.png" /><span>Âge de la lignée</span></ng-template>
  <ng-template #alphaTitle><img src="assets/img/world/most_renowned_person.png" /><span>Chef de famille</span></ng-template>
  <ng-template #housedTitle><img src="assets/img/world/housed.png" /><span>Logés</span></ng-template>
  <ng-template #housesTitle><img src="assets/img/world/houses.png" /><span>Toits</span></ng-template>
  <ng-template #membersTitle><img src="assets/img/world/population.png" /><span>Membres</span></ng-template>
  <ng-template #moneyTitle><img src="assets/img/stats/money.png" /><span>Pièces</span></ng-template>
  <ng-template #renownTitle><img src="assets/img/stats/renown.png" /><span>Renommée</span></ng-template>
}
