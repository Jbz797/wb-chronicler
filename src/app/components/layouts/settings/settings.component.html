@if (unreachable()) {
  <p class="unreachable">{{ 'ui_service_down' | translate }}</p>
} @else {
  <nz-radio-group class="languages" [ngModel]="lang()" (ngModelChange)="lang.set($event)">
    <label nz-radio-button nzValue="fr">
      <img class="flag" src="assets/img/flags/fr.png" />
      Français
    </label>
    <label nz-radio-button nzValue="en">
      <img class="flag" src="assets/img/flags/en.png" />
      English
    </label>
  </nz-radio-group>

  <label class="dev-mode" nz-checkbox [ngModel]="dev()" (ngModelChange)="dev.set($event)">{{ 'ui_dev_mode' | translate }}</label>

  <nz-divider />

  <nz-alert nzType="warning" [nzDescription]="manualSaves" [nzMessage]="'ui_autosave_off' | translate" />
  <ng-template #manualSaves>
    {{ 'ui_autosave_off_why' | translate }}
  </ng-template>

  <nz-divider />

  <p class="intro">{{ 'ui_pick_save' | translate }}</p>

  <ng-scrollbar class="choices-scroll">
    <nz-radio-group class="choices" [ngModel]="picked()" (ngModelChange)="picked.set($event)">
      @for (candidate of candidates(); track candidate.path) {
        <label nz-radio [nzValue]="candidate.path">
          <span class="world">{{ candidate.world ?? ('ui_unnamed_world' | translate) }}</span>
          <span class="detail" nz-tooltip [nzTooltipTitle]="candidate.path">
            {{ shortPath(candidate.path) }} · {{ candidate.size / 1024 | number: '1.0-0' }} {{ 'ui_size_kb' | translate }} · {{ 'ui_modified_on' | translate }}
            {{ candidate.mtime | date: ('ui_date_format' | translate) }}
          </span>
        </label>
      }
      <label nz-radio [nzValue]="customValue">
        <span>{{ 'ui_other_location' | translate }}</span>
      </label>
    </nz-radio-group>
  </ng-scrollbar>

  @if (isCustom()) {
    <input nz-input [ngModel]="custom()" [placeholder]="'ui_path_example' | translate" (ngModelChange)="custom.set($event)" />
  }

  @if (isAutosave()) {
    <nz-alert nzType="error" [nzMessage]="'ui_autosave_path' | translate" />
  }
}
